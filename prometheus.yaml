global:
  scrape_interval: 30s
  evaluation_interval: 30s
  scrape_timeout: 10s

scrape_configs:
  # Application Services
  - job_name: "api-gateway"
    metrics_path: /metrics
    static_configs:
      - targets: ["api-gateway:8080"]

  - job_name: "db-gateway"
    metrics_path: /metrics
    static_configs:
      - targets: ["db-gateway:8080"]

  - job_name: "unified-device-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["unified-device-service:8080"]

  - job_name: "connectivity-service"
    metrics_path: /metrics
    static_configs:
      - targets: ["connectivity-service:8080"]

  # Infrastructure
  - job_name: "rabbitmq"
    metrics_path: /metrics
    static_configs:
      - targets: ["rabbitmq:15692"]

  - job_name: "mongodb-exporter"
    metrics_path: /metrics
    static_configs:
      - targets: ["mongodb-exporter:9216"]

  - job_name: "prometheus"
    metrics_path: /metrics
    static_configs:
      - targets: ["localhost:9090"]
