name: domovoy

services:
  device-service:
    container_name: device-service
    image: ${DOCKER_REGISTRY-}device-service
    build:
      context: .
      dockerfile: src/Services/Domovoy.DeviceService/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    links:
      - rabbitmq

