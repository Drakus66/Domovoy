name: domovoy

networks:
  domovoy-network:
    driver: bridge

services:
  # ============ Application Services ============

  # Subscribes to the capability contract on the bus and re-emits normalized state for SignalR/persist.
  # No HTTP/MQTT — RabbitMQ AMQP only.
  unified-device-service:
    container_name: unified-device-service
    image: ${DOCKER_REGISTRY-}unified-device-service
    build:
      context: .
      dockerfile: src/Services/Domovoy.UnifiedDeviceService/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - domovoy-network
    environment:
      - RABBITMQ__HOSTNAME=rabbitmq
      - RABBITMQ__PORT=5672
      - RABBITMQ__USERNAME=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ__PASSWORD=${RABBITMQ_DEFAULT_PASS}
      - SERILOG_MONGO_URI=mongodb://mongodb:27017/domovoy
    restart: unless-stopped

  # Owns the MQTT client; runs Zigbee2MQTT + Domovoy Native adapters and publishes the capability
  # contract. Needs RabbitMQ (AMQP + MQTT broker), nothing else.
  connectivity-service:
    container_name: connectivity-service
    image: ${DOCKER_REGISTRY-}connectivity-service
    build:
      context: .
      dockerfile: src/Services/Domovoy.Connectivity/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - domovoy-network
    environment:
      - RABBITMQ__HOSTNAME=rabbitmq
      - RABBITMQ__PORT=5672
      - RABBITMQ__USERNAME=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ__PASSWORD=${RABBITMQ_DEFAULT_PASS}
      - MQTT__BROKER=rabbitmq
      - MQTT__PORT=1883
      - SERILOG_MONGO_URI=mongodb://mongodb:27017/domovoy
    restart: unless-stopped

  db-gateway:
    container_name: db-gateway
    image: ${DOCKER_REGISTRY-}db-gateway
    build:
      context: .
      dockerfile: src/Gateway/Domovoy.DbGateway/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - domovoy-network
    ports:
      - "5001:8080"
    environment:
      - RABBITMQ__HOSTNAME=rabbitmq
      - RABBITMQ__PORT=5672
      - RABBITMQ__USERNAME=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ__PASSWORD=${RABBITMQ_DEFAULT_PASS}
      - MONGODB__CONNECTIONSTRING=mongodb://mongodb:27017
      - MONGODB__DATABASENAME=domovoy
      - SERILOG_MONGO_URI=mongodb://mongodb:27017/domovoy
    healthcheck:
      test: ["CMD-SHELL", "pgrep -f 'dotnet Domovoy.DbGateway.dll' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 45s
    restart: unless-stopped

  api-gateway:
    container_name: api-gateway
    image: ${DOCKER_REGISTRY-}api-gateway
    build:
      context: .
      dockerfile: src/Gateway/Domovoy.ApiGateway/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      db-gateway:
        condition: service_started
    networks:
      - domovoy-network
    ports:
      - "5000:8080"
    environment:
      - RABBITMQ__HOSTNAME=rabbitmq
      - RABBITMQ__PORT=5672
      - RABBITMQ__USERNAME=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ__PASSWORD=${RABBITMQ_DEFAULT_PASS}
      - AUTOMATIONSERVICE__BASEURL=http://automation-service:8080
      - SERILOG_MONGO_URI=mongodb://mongodb:27017/domovoy
    restart: unless-stopped

  # Deterministic automation engine (Epic 1A): subscribes to device state, fires trigger→condition→action
  # rules, runs cron/sun schedules, and the non-disableable safety floor. Loads rules from db-gateway.
  automation-service:
    container_name: automation-service
    image: ${DOCKER_REGISTRY-}automation-service
    build:
      context: .
      dockerfile: src/Services/Domovoy.AutomationService/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      db-gateway:
        condition: service_started
    networks:
      - domovoy-network
    environment:
      - RABBITMQ__HOSTNAME=rabbitmq
      - RABBITMQ__PORT=5672
      - RABBITMQ__USERNAME=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ__PASSWORD=${RABBITMQ_DEFAULT_PASS}
      - AUTOMATION__DBGATEWAYBASEURL=http://db-gateway:8080
      - SERILOG_MONGO_URI=mongodb://mongodb:27017/domovoy
    restart: unless-stopped

  # Integration SDK supervisor (Epic 1C): discovers plugin manifests under ./plugins, gates each on host
  # resources, and runs satisfiable ones as isolated processes. Plugins connect to the bus themselves.
  plugin-supervisor:
    container_name: plugin-supervisor
    image: ${DOCKER_REGISTRY-}plugin-supervisor
    build:
      context: .
      dockerfile: src/Services/Domovoy.PluginSupervisor/Dockerfile
    networks:
      - domovoy-network
    volumes:
      - ./plugins:/app/plugins:ro
    environment:
      - SUPERVISOR__GPUAVAILABLE=false
      - SUPERVISOR__INTERNETAVAILABLE=true
      - SERILOG_MONGO_URI=mongodb://mongodb:27017/domovoy
    restart: unless-stopped

  webui:
    container_name: webui
    image: ${DOCKER_REGISTRY-}webui
    build:
      context: src/UI/WebUI
      dockerfile: Dockerfile
    depends_on:
      api-gateway:
        condition: service_started
    networks:
      - domovoy-network
    ports:
      - "80:80"
    # UI translations are runtime-loaded static JSON (i18next-http-backend). Mounting
    # the source locales over the served folder means editing a language — or, later,
    # dropping a new one — takes effect on refresh with NO image rebuild. Read-only:
    # the container never writes here.
    volumes:
      - ./src/UI/WebUI/public/locales:/usr/share/nginx/html/locales:ro
    restart: unless-stopped

  # ============ Infrastructure Services ============

  mongodb:
    container_name: mongodb
    image: mongo:latest
    networks:
      - domovoy-network
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=domovoy
    healthcheck:
      test: echo 'db.runCommand("{\"ping\":1}").ok' | mongosh localhost:27017/admin --quiet
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  mongodb-exporter:
    image: percona/mongodb_exporter:0.40.0
    container_name: mongodb-exporter
    networks:
      - domovoy-network
    ports:
      - "9216:9216"
    command:
      - '--mongodb.uri=mongodb://mongodb:27017'
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  rabbitmq:
    image: bitnami/rabbitmq:latest
    container_name: rabbitmq
    networks:
      - domovoy-network
    ports:
      - "1883:1883" # MQTT
      - "5672:5672" # AMQP
      - "15672:15672" # Management UI
      - "15675:15675" # MQTT over WebSocket
    environment:
      - RABBITMQ_USERNAME=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_DEFAULT_PASS}
      - RABBITMQ_PLUGINS=rabbitmq_mqtt,rabbitmq_management,rabbitmq_prometheus
    volumes:
      - rabbitmq_data:/bitnami/rabbitmq/mnesia

    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ============ Monitoring (Prometheus-only) ============

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    networks:
      - domovoy-network
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=7d'
      - '--storage.tsdb.retention.size=2GB'
      - '--web.enable-lifecycle'
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  zigbee2mqtt:
    container_name: zigbee2mqtt
    image: koenkk/zigbee2mqtt
    volumes:
      - ./data/zigbee2mqtt:/app/data
      - /run/udev:/run/udev:ro
    ports:
      - 8081:8080
    environment:
      - TZ=UTC
    privileged: true
    networks:
      - domovoy-network
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  mongodb_data:
  rabbitmq_data:
  prometheus_data:
