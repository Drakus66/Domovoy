  mongodb:
    container_name: mongodb
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    # Add healthcheck for MongoDB
    healthcheck:
      test: echo 'db.runCommand(\"{\\\"ping\\\":1}\")\".ok' | mongo localhost:27017/admin --quiet
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # MongoDB exporter for Prometheus metrics
  mongodb-exporter:
    image: percona/mongodb_exporter:latest
    container_name: mongodb-exporter
    ports:
      - "9216:9216"
    command:
      - '--mongodb.uri=mongodb://mongodb:27017'
    depends_on:
      mongodb:
        condition: service_healthy

  rabbitmq:
    image: bitnami/rabbitmq
    container_name: rabbitmq
    restart: unless-stopped
    healthcheck:
      test: rabbitmq-diagnostics -q status
      interval: 30s
      timeout: 30s
      retries: 3
    environment:
      - RABBITMQ_ENABLED_PLUGINS=rabbitmq_mqtt
      - RABBITMQ_ENABLED_PLUGINS=rabbitmq_management
      - RABBITMQ_ENABLED_PLUGINS=rabbitmq_prometheus
    ports:
      - "1883:1883"
      - "5672:5672"
      - "15672:15672"
      - "15675:15675"


  promtail:
    image: grafana/promtail:latest
    container_name: promtail
    ports:
      - "9080:9080"
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./promtail-config.yaml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    privileged: true

  loki:
    image: grafana/loki:latest
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    depends_on:
      rabbitmq:
        condition: service_healthy

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
      - grafana_data:/var/lib/grafana

configs:
  rabbitmq-plugins:
    content: "[rabbitmq_mqtt, rabbitmq_management]."

volumes:
  mongodb_data:
  grafana_data:
  prometheus_data:
