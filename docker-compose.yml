name: domovoy

networks:
  domovoy-network:
    driver: bridge

services:
  # ============ Application Services ============

  device-service:
    container_name: device-service
    image: ${DOCKER_REGISTRY-}device-service
    build:
      context: .
      dockerfile: src/Services/Domovoy.DeviceService/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - domovoy-network
    environment:
      - RABBITMQ__HOSTNAME=rabbitmq
      - RABBITMQ__PORT=5672
      - RABBITMQ__USERNAME=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ__PASSWORD=${RABBITMQ_DEFAULT_PASS}
      - MQTT__BROKER=rabbitmq
      - MQTT__PORT=1883
    restart: unless-stopped

  connectivity-service:
    container_name: connectivity-service
    image: ${DOCKER_REGISTRY-}connectivity-service
    build:
      context: .
      dockerfile: src/Services/Domovoy.Connectivity/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - domovoy-network
    environment:
      - RABBITMQ__HOSTNAME=rabbitmq
      - RABBITMQ__PORT=5672
      - RABBITMQ__USERNAME=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ__PASSWORD=${RABBITMQ_DEFAULT_PASS}
      - MQTT__BROKER=rabbitmq
      - MQTT__PORT=1883
    restart: unless-stopped

  db-gateway:
    container_name: db-gateway
    image: ${DOCKER_REGISTRY-}db-gateway
    build:
      context: .
      dockerfile: src/Gateway/Domovoy.DbGateway/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - domovoy-network
    ports:
      - "5001:8080"
    environment:
      - RABBITMQ__HOSTNAME=rabbitmq
      - RABBITMQ__PORT=5672
      - RABBITMQ__USERNAME=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ__PASSWORD=${RABBITMQ_DEFAULT_PASS}
      - MONGODB__CONNECTIONSTRING=mongodb://mongodb:27017
      - MONGODB__DATABASENAME=domovoy
    restart: unless-stopped

  api-gateway:
    container_name: api-gateway
    image: ${DOCKER_REGISTRY-}api-gateway
    build:
      context: .
      dockerfile: src/Gateway/Domovoy.ApiGateway/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
      db-gateway:
        condition: service_started
    networks:
      - domovoy-network
    ports:
      - "5000:8080"
    environment:
      - RABBITMQ__HOSTNAME=rabbitmq
      - RABBITMQ__PORT=5672
      - RABBITMQ__USERNAME=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ__PASSWORD=${RABBITMQ_DEFAULT_PASS}
      - DBGATEWAY__BASEURL=http://db-gateway:8080
    restart: unless-stopped

  # ============ Commented Services (Not yet implemented) ============

  light-service:
    container_name: light-service
    image: ${DOCKER_REGISTRY-}light-service
    build:
      context: .
      dockerfile: src/Services/Domovoy.LightService/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - domovoy-network
    environment:
      - RABBITMQ__HOSTNAME=rabbitmq
      - RABBITMQ__PORT=5672
      - RABBITMQ__USERNAME=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ__PASSWORD=${RABBITMQ_DEFAULT_PASS}
    restart: unless-stopped

  sensor-service:
    container_name: sensor-service
    image: ${DOCKER_REGISTRY-}sensor-service
    build:
      context: .
      dockerfile: src/Services/Domovoy.SensorService/Dockerfile
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - domovoy-network
    environment:
      - RABBITMQ__HOSTNAME=rabbitmq
      - RABBITMQ__PORT=5672
      - RABBITMQ__USERNAME=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ__PASSWORD=${RABBITMQ_DEFAULT_PASS}
    restart: unless-stopped

  # ============ Infrastructure Services ============

  mongodb:
    container_name: mongodb
    image: mongo:latest
    networks:
      - domovoy-network
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=domovoy
    healthcheck:
      test: echo 'db.runCommand("{\"ping\":1}").ok' | mongosh localhost:27017/admin --quiet
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  mongodb-exporter:
    image: percona/mongodb_exporter:0.40.0
    container_name: mongodb-exporter
    networks:
      - domovoy-network
    ports:
      - "9216:9216"
    command:
      - '--mongodb.uri=mongodb://mongodb:27017'
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped

  rabbitmq:
    image: bitnami/rabbitmq:latest
    container_name: rabbitmq
    networks:
      - domovoy-network
    ports:
      - "1883:1883" # MQTT
      - "5672:5672" # AMQP
      - "15672:15672" # Management UI
      - "15675:15675" # MQTT over WebSocket
    environment:
      - RABBITMQ_USERNAME=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ_PASSWORD=${RABBITMQ_DEFAULT_PASS}
      - RABBITMQ_PLUGINS=rabbitmq_mqtt,rabbitmq_management,rabbitmq_prometheus
    volumes:
      - rabbitmq_data:/bitnami/rabbitmq/mnesia

    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # ============ Monitoring & Logging ============

  promtail:
    image: grafana/promtail:3.5.1
    container_name: promtail
    networks:
      - domovoy-network
    ports:
      - "9080:9080"
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./promtail-config.yaml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    privileged: true
    restart: unless-stopped

  loki:
    image: grafana/loki:3.5.1
    container_name: loki
    networks:
      - domovoy-network
    ports:
      - "3100:3100"
    volumes:
      - ./loki-config.yaml:/etc/loki/local-config.yaml
      - loki_data:/loki
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    networks:
      - domovoy-network
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yaml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    networks:
      - domovoy-network
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

  zigbee2mqtt:
    container_name: zigbee2mqtt
    image: koenkk/zigbee2mqtt
    volumes:
      - ./data/zigbee2mqtt:/app/data
      - /run/udev:/run/udev:ro
    ports:
      - 8080:8080
    environment:
      - TZ=UTC
    networks:
      - domovoy-network
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy

volumes:
  mongodb_data:
  rabbitmq_data:
  grafana_data:
  prometheus_data:
  loki_data:
