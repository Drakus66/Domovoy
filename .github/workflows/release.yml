name: Release

# Сборка и публикация версионированных образов (Эпик 3K).
#
# Каналы привязаны к веткам: develop → `dev`, master → `release`. Тесты из ci.yml — обязательный
# гейт перед публикацией: ci.yml объявлен `workflow_call`, поэтому вызывается как функция, а не
# копируется сюда.
#
# Сборка СЕЛЕКТИВНАЯ: пересобираются только компоненты, чьи пути затронул диапазон коммитов
# (build/tools/plan-build.mjs). Непересобранный компонент остаётся в реестре со своей прежней
# версией, а подвижный тег канала продолжает указывать на старый образ — так работает точечное
# обновление на стороне дома.

on:
  push:
    branches:
      - develop
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  tests:
    name: Tests
    uses: ./.github/workflows/ci.yml

  plan:
    name: Plan build
    needs: tests
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      topology: ${{ steps.plan.outputs.topology }}
      has_images: ${{ steps.plan.outputs.has_images }}
      has_topology: ${{ steps.plan.outputs.has_topology }}
      channel: ${{ steps.channel.outputs.channel }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve channel
        id: channel
        run: |
          if [ "${{ github.ref_name }}" = "master" ]; then
            echo "channel=release" >> "$GITHUB_OUTPUT"
          else
            echo "channel=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect changed files
        id: changed
        run: |
          BEFORE="${{ github.event.before }}"
          # Первый push ветки (before = нули), ручной запуск или недоступная база — собираем всё.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] \
             || [ -z "$BEFORE" ] \
             || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] \
             || ! git rev-parse --verify --quiet "$BEFORE" >/dev/null; then
            echo "all=true" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only "$BEFORE" "${{ github.sha }}" > changed.txt
            echo "all=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Plan
        id: plan
        run: |
          if [ "${{ steps.changed.outputs.all }}" = "true" ]; then
            node build/tools/plan-build.mjs --all \
              --channel "${{ steps.channel.outputs.channel }}" \
              --run "${{ github.run_number }}" --sha "${{ github.sha }}"
          else
            node build/tools/plan-build.mjs --changed changed.txt \
              --channel "${{ steps.channel.outputs.channel }}" \
              --run "${{ github.run_number }}" --sha "${{ github.sha }}"
          fi

  images:
    name: ${{ matrix.name }}
    needs: plan
    if: needs.plan.outputs.has_images == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}
          # Точная версия + подвижный тег канала + отпечаток коммита. Точную версию система
          # показывает человеку, за подвижным тегом следит updater, sha нужен для разбора инцидентов.
          tags: |
            type=raw,value=${{ matrix.version }}
            type=raw,value=${{ needs.plan.outputs.channel }}
            type=sha,format=short,prefix=sha-
          labels: |
            org.opencontainers.image.version=${{ matrix.informational }}
            ru.domovoy.component=${{ matrix.name }}
            ru.domovoy.channel=${{ needs.plan.outputs.channel }}
            ru.domovoy.deps=${{ matrix.deps }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          # Только amd64: roadmap 3H исключил ARM из целевого железа (Pi 4 не тянет MongoDB >= 5.0).
          platforms: linux/amd64
          build-args: |
            VERSION=${{ matrix.version }}
            INFORMATIONAL_VERSION=${{ matrix.informational }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  topology:
    name: topology bundle
    needs: plan
    if: needs.plan.outputs.has_topology == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Generate deployment compose
        run: |
          node build/tools/gen-topology.mjs \
            --out build/topology/dist \
            --channel "${{ needs.plan.outputs.channel }}"

      # Гарантию корректности даёт не построчный генератор, а эта проверка: compose сам
      # разбирает результат и падает на любой структурной ошибке.
      - name: Validate generated compose
        run: |
          docker compose --project-directory . \
            -f build/topology/dist/docker-compose.yml \
            --env-file build/topology/.env.template config -q

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ fromJson(needs.plan.outputs.topology).image }}
          tags: |
            type=raw,value=${{ fromJson(needs.plan.outputs.topology).version }}
            type=raw,value=${{ needs.plan.outputs.channel }}
            type=sha,format=short,prefix=sha-
          labels: |
            ru.domovoy.component=topology
            ru.domovoy.channel=${{ needs.plan.outputs.channel }}
            ru.domovoy.deps=${{ fromJson(needs.plan.outputs.topology).deps }}

      # Однослойный scratch-образ: updater качает слой напрямую через Registry v2 и
      # распаковывает — ни ORAS, ни `docker cp` не нужны.
      - name: Build and push bundle
        uses: docker/build-push-action@v7
        with:
          context: build/topology
          file: build/topology/Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
