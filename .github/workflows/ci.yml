name: CI

# Build + test on every push/PR. Two gates:
#  • build-test — compiles the .NET solution and the WebUI, runs the fast unit tests (no Docker).
#  • offline-smoke — runs the OfflineSmoke integration tests against REAL RabbitMQ + Mongo spun up locally
#    by Testcontainers (loopback only). This is the offline-first invariant as a check, not a claim
#    (roadmap principle 2 / Phase 1.5): the core data-path works with no external network in the hot path.

on:
  push:
    # Только эпик-ветки: для master/develop этот же workflow вызывается из release.yml как гейт
    # публикации (workflow_call ниже). Держать их и здесь — значит прогонять весь набор тестов
    # дважды на каждый пуш.
    branches: ['epic-*']
  pull_request:
  workflow_dispatch:
  # Вызывается как функция из release.yml (Эпик 3K): тесты — обязательный гейт перед публикацией
  # образов, и дублировать их описание в двух местах незачем.
  workflow_call:

jobs:
  # Страж контракта (Эпик 3K). Решатель обновлений доверяет только тому, что объявлено в
  # build/components.json, поэтому незаявленное изменение контракта — единственный способ тихо
  # получить несовместимое обновление на боевом доме. Обход осознанный и видимый в истории:
  # строка `Compat: none` в теле коммита.
  contract-guard:
    name: Contract guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # нужен диапазон коммитов, а не один снимок

      - name: Check declared compatibility
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          bash build/tools/contract-guard.sh "$BASE" "${{ github.sha }}"

      - name: Validate component set
        run: node build/tools/validate-components.mjs

  build-test:
    name: Build + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore Domovoy.sln

      - name: Build
        run: dotnet build Domovoy.sln -c Release --no-restore

      # Всё решение, а не один тестовый проект: указание конкретного .csproj однажды уже привело к
      # тому, что тесты Domovoy.CommutePlugin.Tests не выполнялись в CI ни разу.
      - name: Unit tests (no Docker)
        run: dotnet test Domovoy.sln -c Release --no-build --filter "Category!=Infra"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: src/UI/WebUI/package-lock.json

      - name: WebUI install
        working-directory: src/UI/WebUI
        run: npm ci

      - name: WebUI build (tsc + vite)
        working-directory: src/UI/WebUI
        run: npm run build

      - name: WebUI tests
        working-directory: src/UI/WebUI
        run: npm test

  offline-smoke:
    name: Offline-first smoke (Testcontainers)
    runs-on: ubuntu-latest # GitHub-hosted runners ship Docker; Testcontainers uses it for local RabbitMQ + Mongo
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      # Runs the OfflineSmoke-tagged integration tests: adapter → bus → Mongo persistence, home-mode change,
      # proposal approval + BSON round-trip — all against local containers, exercising the offline invariant.
      - name: Offline-smoke tests
        run: dotnet test Domovoy.sln -c Release --filter "Category=OfflineSmoke"
