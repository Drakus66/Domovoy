services:
  db-gateway:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - RABBITMQ__USERNAME=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ__PASSWORD=${RABBITMQ_DEFAULT_PASS}

  api-gateway:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - RABBITMQ__USERNAME=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ__PASSWORD=${RABBITMQ_DEFAULT_PASS}

  # Delivery service (Epic 3K) in local development: never phone the registry and never raise
  # "a new version is available" while you are the one making the versions. The installation
  # root is the repository itself, so `releases/` and `state/` land under ./data/updater.
  domovoy-updater:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - UPDATES__CHECKENABLED=false
      - RABBITMQ__USERNAME=${RABBITMQ_DEFAULT_USER}
      - RABBITMQ__PASSWORD=${RABBITMQ_DEFAULT_PASS}

  rabbitmq:
    environment:
      RABBITMQ_USERNAME: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_PASSWORD: ${RABBITMQ_DEFAULT_PASS}
      RABBITMQ_MANAGEMENT_ALLOW_WEB_ACCESS: "true"
      BITNAMI_DEBUG: "true"
