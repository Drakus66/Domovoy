Routes:
  # WebUI Dashboard routes
  - DownstreamPathTemplate: /{everything}
    DownstreamScheme: http
    DownstreamHostAndPorts:
      - Host: webui
        Port: 80
    UpstreamPathTemplate: /{everything}
    UpstreamHttpMethod: [ "GET", "POST", "PUT", "DELETE" ]
    Priority: 1

  # DbGateway GET routes (no auth required for read operations)
  - DownstreamPathTemplate: /api/devices/{everything}
    DownstreamScheme: http
    DownstreamHostAndPorts:
      - Host: db-gateway
        Port: 8080
    UpstreamPathTemplate: /api/devices/{everything}
    UpstreamHttpMethod: [ "GET" ]
    Priority: 2

  - DownstreamPathTemplate: /api/locations/{everything}
    DownstreamScheme: http
    DownstreamHostAndPorts:
      - Host: db-gateway
        Port: 8080
    UpstreamPathTemplate: /api/locations/{everything}
    UpstreamHttpMethod: [ "GET" ]
    Priority: 2

  - DownstreamPathTemplate: /api/sensors/{everything}
    DownstreamScheme: http
    DownstreamHostAndPorts:
      - Host: db-gateway
        Port: 8080
    UpstreamPathTemplate: /api/sensors/{everything}
    UpstreamHttpMethod: [ "GET" ]
    Priority: 2

  # DbGateway routes with authentication (for write operations)
  - DownstreamPathTemplate: /api/devices/{everything}
    DownstreamScheme: http
    DownstreamHostAndPorts:
      - Host: db-gateway
        Port: 8080
    UpstreamPathTemplate: /api/devices/{everything}
    UpstreamHttpMethod: [ "POST", "PUT", "DELETE" ]
    AuthenticationOptions:
      AuthenticationProviderKey: "Bearer"
    RouteClaimsRequirement:
      Role: "User,Admin"
    RateLimitOptions:
      ClientWhitelist: []
      EnableRateLimiting: true
      Period: "1m"
      PeriodTimespan: 60
      Limit: 100
    FileCacheOptions:
      TtlSeconds: 15

  - DownstreamPathTemplate: /api/locations/{everything}
    DownstreamScheme: http
    DownstreamHostAndPorts:
      - Host: db-gateway
        Port: 8080
    UpstreamPathTemplate: /api/locations/{everything}
    UpstreamHttpMethod: [ "POST", "PUT", "DELETE" ]
    AuthenticationOptions:
      AuthenticationProviderKey: "Bearer"
    RouteClaimsRequirement:
      Role: "User,Admin"

  - DownstreamPathTemplate: /api/sensors/{everything}
    DownstreamScheme: http
    DownstreamHostAndPorts:
      - Host: db-gateway
        Port: 8080
    UpstreamPathTemplate: /api/sensors/{everything}
    UpstreamHttpMethod: [ "POST", "PUT", "DELETE" ]
    AuthenticationOptions:
      AuthenticationProviderKey: "Bearer"
    RouteClaimsRequirement:
      Role: "User,Admin"

  # NOTE: Routes for auth / device-control / mqtt / users / automations were removed.
  # Those standalone services (domovoy-authservice, domovoy-deviceservice, domovoy-mqttservice,
  # domovoy-userservice, domovoy-automationservice) no longer exist after the service
  # consolidation. Device commands are now handled in-process by DeviceControlController
  # (POST /api/device-control/command) which publishes to the message bus. Re-add Ocelot
  # routes here if/when those capabilities return as separate services.

GlobalConfiguration:
  BaseUrl: http://localhost:5000
  RequestIdKey: "X-Request-ID"
  RateLimitOptions:
    DisableRateLimitHeaders: false
    QuotaExceededMessage: "Rate limit exceeded. Try again in {0} second(s)."
    HttpStatusCode: 429
  LoadBalancerOptions:
    Type: "LeastConnection"
    Key: null
    Expiry: 0
  QoSOptions:
    ExceptionsAllowedBeforeBreaking: 3
    DurationOfBreak: 5000
    TimeoutValue: 5000
