<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Domovoy Smart Home — Real-time device monitoring dashboard">
    <title>Domovoy — Smart Home Dashboard</title>
    <link rel="stylesheet" href="/css/styles.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-inner">
            <a class="logo" href="/">
                <div class="logo-icon">🏠</div>
                <span class="logo-text">Domovoy</span>
            </a>
            <div class="header-status">
                <div id="connectionStatus" class="connection-status disconnected">
                    <span class="status-dot"></span>
                    <span id="connectionText">Отключено</span>
                </div>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-container">

        <!-- Notifications Panel (full width) -->
        <section class="card notifications-panel">
            <div class="card-header">
                <div class="card-title">
                    <span class="icon">🔔</span>
                    Уведомления
                    <span id="notificationCount" class="card-badge" style="display:none">0</span>
                </div>
                <button class="btn-clear" onclick="clearNotifications()">Очистить</button>
            </div>
            <div class="card-body" id="notificationsList">
                <div class="empty-state" id="notificationsEmpty">
                    <span class="icon">🔕</span>
                    <div class="title">Нет уведомлений</div>
                    <div class="subtitle">Новые события появятся здесь автоматически</div>
                </div>
            </div>
        </section>

        <!-- Devices Panel -->
        <section class="card">
            <div class="card-header">
                <div class="card-title">
                    <span class="icon">📡</span>
                    Устройства
                    <span id="deviceCount" class="card-badge" style="display:none">0</span>
                </div>
            </div>
            <div class="card-body">
                <div class="devices-grid" id="devicesGrid">
                    <div class="empty-state" id="devicesEmpty">
                        <span class="icon">📦</span>
                        <div class="title">Нет устройств</div>
                        <div class="subtitle">Обнаруженные устройства отобразятся здесь</div>
                    </div>
                </div>
            </div>
        </section>

        <!-- Event Log Panel -->
        <section class="card event-log-panel">
            <div class="card-header">
                <div class="card-title">
                    <span class="icon">📋</span>
                    Лог событий
                </div>
                <button class="btn-clear" onclick="clearLog()">Очистить</button>
            </div>
            <div class="card-body" id="eventLog">
                <div class="empty-state" id="logEmpty">
                    <span class="icon">📝</span>
                    <div class="title">Лог пуст</div>
                    <div class="subtitle">События от шлюза будут записываться здесь</div>
                </div>
            </div>
        </section>

    </main>

    <!-- SignalR JS Client -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"
            integrity="sha512-7rhBJh1hRwMKEX4PVdMrdJGBIF/W6T1gKnL3I6I3KxWpweAu1ajvOaUi6TwMnD1r1C6ep3btBUoVEpMfIi/Kw=="
            crossorigin="anonymous"
            referrerpolicy="no-referrer"></script>
    <script src="/js/app.js"></script>
</body>
</html>
