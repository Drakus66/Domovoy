server {
    listen 80;
    server_name localhost;
    resolver 127.0.0.11 valid=30s;

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        set $api_gateway "api-gateway:8080";
        proxy_pass http://$api_gateway;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SignalR live device-state hub. Must be proxied with HTTP/1.1 + Upgrade so the
    # WebSocket (and the /hub/devices/negotiate handshake) reach the gateway. Without
    # this, /hub/* falls through to the SPA index.html, SignalR silently fails to
    # connect, and the UI degrades to 20s REST polling — multi-second state latency.
    location /hub/ {
        set $api_gateway "api-gateway:8080";
        proxy_pass http://$api_gateway;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
