<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-label="Domovoy">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#f0a92b"/>
    </linearGradient>
    <radialGradient id="ember" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffe7a8"/>
      <stop offset="0.55" stop-color="#f5a623"/>
      <stop offset="1" stop-color="#d9791b"/>
    </radialGradient>
  </defs>
  <!-- Full-bleed background so the icon works as a maskable icon (safe content stays within the centre 80%). -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- House silhouette (the "home spirit's" hearth), centred within the maskable safe zone. -->
  <g fill="none" stroke="#fdf6e3" stroke-width="26" stroke-linejoin="round" stroke-linecap="round">
    <path d="M256 132 L372 226 V368 a16 16 0 0 1 -16 16 H156 a16 16 0 0 1 -16 -16 V226 Z"/>
  </g>
  <!-- Breathing ember at the hearth. -->
  <circle cx="256" cy="312" r="40" fill="url(#ember)"/>
</svg>
